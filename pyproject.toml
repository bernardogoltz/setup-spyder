[project]
name = "setup-spyder"
version = "0.1.0"
description = "Importable Spyder 5.x launcher (JetBrains Mono, wrap lines) for other repositories."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=3.0.5",
    "rich>=13.9",
    "spyder>=5.5,<6",
]

[project.urls]
Homepage = "https://github.com/bernardogoltz/setup-spyder"
Repository = "https://github.com/bernardogoltz/setup-spyder"

[project.scripts]
setup-spyder = "setup_spyder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
