[project]
name = "setup-spyder"
dynamic = ["version"]
description = "Importable Spyder 5.x launcher (JetBrains Mono, wrap lines) for other repositories."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bernardo Goltz" }]
keywords = ["spyder", "ide", "eda", "data-analysis", "launcher", "uv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: User Interfaces",
]
dependencies = [
    "pandas>=2.0",
    "rich>=13.9",
    "spyder>=5.5,<6",
]

[project.urls]
Homepage = "https://github.com/bernardogoltz/setup-spyder"
Repository = "https://github.com/bernardogoltz/setup-spyder"
Issues = "https://github.com/bernardogoltz/setup-spyder/issues"

[project.scripts]
setup-spyder = "setup_spyder.cli:main"
setup-spyder-integration = "setup_spyder.integration:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/setup_spyder/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/setup_spyder"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
