name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # `spyder` is the bernardogoltz fork, pinned by commit in pyproject.toml,
  # resolved in uv.lock and fetched from GitHub. The fork is a pre-release
  # (5.6.0.devN), so uv needs to be told to accept one.
  UV_PRERELEASE: allow
  # QT_QPA_PLATFORM=offscreen and the QtWebEngine flags are set only on Linux
  # (see the `full` job): the Windows runner has a desktop session, and
  # QtWebEngine under the offscreen platform on Windows dies with an access
  # violation the moment a QWebEngineView is created (first test in tests/qt).

jobs:
  unit:
    # No Qt, no PTY: launcher, profiles, providers, static scans.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"
      - name: Unit tests (no Qt, no PTY)
        run: uv run --python ${{ matrix.python-version }} pytest -m "unit or legacy" -v

  full:
    # Qt widget tests, ConPTY/PTY contract and the integration probes that
    # import the fork. Windows is the primary platform of this project.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache-dependency-glob: "pyproject.toml"
      - name: Qt runtime libraries and headless platform (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1
          echo "QT_QPA_PLATFORM=offscreen" >> "$GITHUB_ENV"
          # A Qt platform plugin is not enough for QtWebEngine: the Chromium
          # child process aborts, and an abort takes the whole pytest run with
          # it (exit code 134, no traceback). Two reasons on this runner, both
          # of them environment and not code:
          #   * the sandbox needs unprivileged user namespaces, which
          #     ubuntu-24.04 denies by AppArmor, and the setuid helper that
          #     would replace them is not setuid inside a pip wheel;
          #   * there is no GPU, so the default GL path has nothing to bind to.
          # tests/qt still probes for a working QtWebEngine in a subprocess
          # (helpers/webengine.py) and skips the page-driving tests with a
          # reason if this is not enough, instead of aborting the session.
          echo "QTWEBENGINE_DISABLE_SANDBOX=1" >> "$GITHUB_ENV"
          echo "QTWEBENGINE_CHROMIUM_FLAGS=--no-sandbox --disable-gpu --disable-dev-shm-usage" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
      - name: Everything except the GUI e2e run
        run: uv run --python ${{ matrix.python-version }} pytest -m "not e2e" -v

  build:
    needs: [unit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: "pyproject.toml"
      - name: Build wheel and sdist
        run: uv build
      - name: Validate package metadata
        run: uvx twine check --strict dist/*
      - name: The wheel must carry the plugin entry point and the web assets
        run: |
          # The shell does not expand a glob inside `name@dist/*.whl`; resolve
          # the wheel path first and hand uv a plain path.
          wheel="$(ls dist/*.whl)"
          echo "checking $wheel"
          uv run --with "$wheel" --no-project python - <<'EOF'
          from importlib.metadata import distribution
          from importlib.resources import files
          dist = distribution("setup-spyder")
          eps = dist.read_text("entry_points.txt")
          assert "setup_spyder_ai = setup_spyder.plugin.plugin:AITerminalPlugin" in eps, eps
          assets = files("setup_spyder.plugin") / "assets"
          for name in ("terminal.html", "terminal.js", "xterm.js", "xterm.css"):
              assert (assets / name).is_file(), name
          reqs = " ".join(dist.requires or [])
          assert "git+https://github.com/bernardogoltz/spyder.git@" in reqs, reqs
          print("wheel ok")
          EOF
      - name: Show artifacts
        run: ls -lh dist
