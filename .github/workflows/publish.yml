name: Publish

# `setup-spyder` depends on the bernardogoltz/spyder fork by Git URL
# (`spyder @ git+https://github.com/bernardogoltz/spyder.git@<commit>`).
# PyPI rejects distributions with direct-URL requirements, so releases are
# published as GitHub Release assets and installed with
#   uv add --dev git+https://github.com/bernardogoltz/setup-spyder@v<version>
# or from the attached wheel URL.

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  UV_PRERELEASE: allow
  # No QT_QPA_PLATFORM=offscreen: the test job runs on Windows, where the
  # offscreen platform crashes QtWebEngine (see ci.yml).

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: "pyproject.toml"
      - name: Tests (everything except the GUI e2e run)
        run: uv run pytest -m "not e2e" -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          cache-dependency-glob: "pyproject.toml"

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/setup_spyder/__init__.py)"
          tag="${GITHUB_REF_NAME#v}"
          echo "package version: $version"
          echo "release tag:     $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::tag '$tag' does not match __version__ '$version'; bump src/setup_spyder/__init__.py before releasing"
            exit 1
          fi

      - name: Build wheel and sdist
        run: uv build

      - name: Validate package metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attach wheel and sdist to the GitHub release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber
